{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-white">
  <div class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8">

    <!-- Header -->
    <div class="border-b border-slate-200 pb-6">
      <div class="flex items-start justify-between gap-6">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-400">
            NGO
          </p>
          <h1 class="mt-2 text-3xl font-semibold text-slate-900">
            Register NGO
          </h1>
          <p class="mt-2 text-sm text-slate-500">
            Create a new NGO partner for future service day activities.
          </p>
        </div>

        <div class="flex gap-3">
          <a href="#"
             class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
            Cancel
          </a>

          <button
            type="submit"
            form="ngo-create-form"
            class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
            Save NGO
          </button>
        </div>
      </div>
    </div>


    <!-- Form -->
    <div class="mt-10 space-y-10">
      <form id="ngo-create-form" method="post">
        {% csrf_token %}

      <!-- Basic Info -->
      <section>
        <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">
          Basic Information
        </h2>

        <div class="mt-4 grid grid-cols-1 gap-6 sm:grid-cols-2">

          <div class="sm:col-span-2">
            <label class="mb-1 block text-sm font-medium text-slate-700">
              NGO Name
            </label>
            <input
              type="text"
              name="ngo_name"
              placeholder="World Wildlife Fund (WWF)"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">
              Registration Number
            </label>
            <input
              type="text"
              name="reg_num"
              placeholder="PPM-123-10-456"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
          </div>

        </div>
      </section>


      <!-- Contact -->
      <section>
        <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">
          Contact Person
        </h2>

        <div class="mt-4 grid grid-cols-1 gap-6 sm:grid-cols-2">

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">
              Contact Name
            </label>
            <input
              type="text"
              name="pic_name"
              placeholder="Nur Iman"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">
              Phone Number
            </label>
            <input
              type="text"
              name="pic_hp"
              placeholder="0123456789"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-sm font-medium text-slate-700">
              Email
            </label>
            <input
              type="email"
              name="pic_email"
              placeholder="contact@ngo.org"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
          </div>

        </div>
      </section>


      <!-- Address -->
      <section>
        <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">
          Address
        </h2>

        <div class="mt-4 grid grid-cols-1 gap-6">

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">
              Address
            </label>
            <textarea
              rows="3"
              name="address"
              placeholder="Full NGO address"
              class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none"></textarea>
          </div>

          <div class="grid grid-cols-1 gap-6 sm:grid-cols-3">

            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">
                Postcode
              </label>
              <input
                type="text"
                name="postcode"
                placeholder="47500"
                class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
            </div>

            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">
                City
              </label>
              <input
                type="text"
                name="city"
                placeholder="Subang Jaya"
                class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
            </div>

            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">
                State
              </label>
              <input
                type="text"
                name="state"
                placeholder="Selangor"
                class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-slate-400 focus:outline-none">
            </div>

          </div>

        </div>
      </section>


      <!-- Description -->
      <section>
        <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">
          NGO Description
        </h2>

        <div class="mt-4">
          <textarea
            name="description"
            rows="4"
            placeholder="Short description about the NGO and its activities"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-slate-400 focus:outline-none"></textarea>
        </div>
      </section>
    </form>
    </div>

  </div>
</div>
{% endblock %}
